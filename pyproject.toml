[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algorithm-playground"
version = "0.1.0"
description = "A learning and benchmarking sandbox for algorithms, with a language-agnostic binary executable contract."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Christopher Priebe" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "plotext>=5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pre-commit>=3.7",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.5.6",
    "myst-parser>=3.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
]

[project.scripts]
algorithm-playground = "algorithm_playground.cli.main:app"

[project.urls]
Homepage = "https://github.com/christopherpriebe/algorithm-playground"
Documentation = "https://github.com/christopherpriebe/algorithm-playground"
Repository = "https://github.com/christopherpriebe/algorithm-playground"

[tool.hatch.build.targets.wheel]
packages = ["src/algorithm_playground"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "integration: end-to-end tests that invoke the CLI as a subprocess",
]

[tool.ty.src]
include = ["src", "tests"]
